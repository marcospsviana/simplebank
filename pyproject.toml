[tool.poetry]
name = "simplebank"
version = "0.1.0"
description = ""
authors = ["marcospsviana <marcospaulo.silvaviana@gmail.com>"]
license = "LGP3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
psycopg = {extras = ["binary", "pool"], version = "^3.2.1"}
sqlalchemy = "^2.0.31"
sqlmodel = "^0.0.19"
psycopg2-binary = "^2.9.9"
fastapi = {extras = ["standard"], version = "^0.112.1"}


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
flake8 = "^7.1.0"
isort = "^5.13.2"
pytest-cov = "^5.0.0"
black = "^24.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--cov=simplebank tests/"

[tool.coverage.run]
omit = [
    # omit __init__.py
    "*/__init__.py",
    "__init__.py",
    "__pycache__/",
    # omit models orm
    "models.py",
    "database_operations.py"
    ]

[tool.flake8]
extend-ignore="E203"
exclude=[".git","__pycache__","docs/source/conf.py","old","build","dist", ".venv"]
max-line-length=120
max-complexity=10